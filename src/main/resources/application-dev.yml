spring:

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:mysql://localhost:3306/trip4hanoi
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

gemini:
  api:
    key: ${GEMINI_API_KEY}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


openapi:
  service:
    api-docs: TRIP4-HANOI
    title: TRIP4 HA NOI APP API Document
    version: 1.0.0
    server: http://localhost:8080


app:
  init:
    admin-password: ${ADMIN_PASSWORD:123456}
    staff-password: ${STAFF_PASSWORD:123456}
