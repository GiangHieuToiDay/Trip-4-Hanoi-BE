
spring:
  datasource:
    url: ${PROD_DB_URL:jdbc:mysql://localhost:3306/trip4hanoi_prod}
    username: ${PROD_DB_USERNAME:admin}
    password: ${PROD_DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect


logging:
  level:
    root: warn
    com.trip4hanoi.app: info

gemini:
  api:
    key: ${GEMINI_API_KEY:your_prod_key_here}
